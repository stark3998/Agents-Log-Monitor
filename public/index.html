<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { cursor: pointer; background: none; border: none; font: inherit; }

/* ── MD3 Design Tokens — Light default ─────────────────────────────────────── */
:root {
  /* Surfaces */
  --md-bg:                #FAFAFA;
  --md-surface:           #FFFFFF;
  --md-surface-variant:   #F3F4F6;
  --md-surface-container: #F8FAFC;

  /* Text */
  --md-on-surface:         #1C1B1F;
  --md-on-surface-variant: #49454F;
  --md-outline:            #CAC4D0;
  --md-outline-variant:    #E7E0EC;

  /* Primary (purple) */
  --md-primary:              #6750A4;
  --md-primary-container:    #EADDFF;
  --md-on-primary-container: #21005D;

  /* Semantic */
  --md-error:              #B3261E;
  --md-error-container:    #F9DEDC;
  --md-success:            #146C2E;
  --md-success-container:  #C6EFC8;
  --md-warning:            #7A5900;
  --md-warning-container:  #FDEAB6;
  --md-info:               #1565C0;
  --md-info-container:     #DBEAFE;

  /* Event type accent stripes */
  --c-tool:   #1565C0;
  --c-prompt: #6750A4;
  --c-notif:  #B45309;
  --c-agent:  #2E7D32;
  --c-lc:     #49454F;

  /* Elevation shadows */
  --shadow-0: none;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);
  --shadow-2: 0 2px 6px rgba(0,0,0,.08), 0 4px 8px rgba(0,0,0,.06);
  --shadow-3: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.06);

  /* Shape */
  --nr:    12px;
  --nr-sm:  8px;
  --nr-lg: 16px;

  /* Layout */
  --sidebar-w: 280px;
  --detail-w:  440px;

  /* Legacy aliases — used by existing JS template strings */
  --bg:      var(--md-bg);
  --surface: var(--md-surface);
  --surface2: var(--md-surface-variant);
  --border:  var(--md-outline-variant);
  --text:    var(--md-on-surface);
  --muted:   var(--md-on-surface-variant);
  --accent:  var(--md-primary);
  --green:   var(--md-success);
  --red:     var(--md-error);
  --yellow:  var(--md-warning);
  --blue:    var(--md-info);
}

/* ── Dark mode token block (reused by media query and data-theme) ────────── */
.dark-tokens {
  --md-bg:                #141218;
  --md-surface:           #1C1B1F;
  --md-surface-variant:   #2B2930;
  --md-surface-container: #211F26;
  --md-on-surface:         #E6E1E5;
  --md-on-surface-variant: #CAC4D0;
  --md-outline:            #49454F;
  --md-outline-variant:    #2B2930;
  --md-primary:              #D0BCFF;
  --md-primary-container:    #4F378B;
  --md-on-primary-container: #EADDFF;
  --md-error:              #F2B8B5;
  --md-error-container:    #601410;
  --md-success:            #6DD58C;
  --md-success-container:  #0A3818;
  --md-warning:            #FBC02D;
  --md-warning-container:  #4A3800;
  --md-info:               #90CAF9;
  --md-info-container:     #0D47A1;
  --c-tool:   #90CAF9;
  --c-prompt: #D0BCFF;
  --c-notif:  #FDD835;
  --c-agent:  #81C784;
  --c-lc:     #CAC4D0;
  --shadow-1: 0 1px 2px rgba(0,0,0,.3),  0 1px 3px rgba(0,0,0,.25);
  --shadow-2: 0 2px 6px rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.20);
  --shadow-3: 0 8px 24px rgba(0,0,0,.40), 0 4px 8px rgba(0,0,0,.30);
}

/* ── Dark mode: system preference (unless explicitly forced light) ─────── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --md-bg:                #141218;
    --md-surface:           #1C1B1F;
    --md-surface-variant:   #2B2930;
    --md-surface-container: #211F26;
    --md-on-surface:         #E6E1E5;
    --md-on-surface-variant: #CAC4D0;
    --md-outline:            #49454F;
    --md-outline-variant:    #2B2930;
    --md-primary:              #D0BCFF;
    --md-primary-container:    #4F378B;
    --md-on-primary-container: #EADDFF;
    --md-error:              #F2B8B5;
    --md-error-container:    #601410;
    --md-success:            #6DD58C;
    --md-success-container:  #0A3818;
    --md-warning:            #FBC02D;
    --md-warning-container:  #4A3800;
    --md-info:               #90CAF9;
    --md-info-container:     #0D47A1;
    --c-tool:   #90CAF9;
    --c-prompt: #D0BCFF;
    --c-notif:  #FDD835;
    --c-agent:  #81C784;
    --c-lc:     #CAC4D0;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3),  0 1px 3px rgba(0,0,0,.25);
    --shadow-2: 0 2px 6px rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.20);
    --shadow-3: 0 8px 24px rgba(0,0,0,.40), 0 4px 8px rgba(0,0,0,.30);
  }
}

/* ── Dark mode: explicit toggle ──────────────────────────────────────────── */
:root[data-theme="dark"] {
  --md-bg:                #141218;
  --md-surface:           #1C1B1F;
  --md-surface-variant:   #2B2930;
  --md-surface-container: #211F26;
  --md-on-surface:         #E6E1E5;
  --md-on-surface-variant: #CAC4D0;
  --md-outline:            #49454F;
  --md-outline-variant:    #2B2930;
  --md-primary:              #D0BCFF;
  --md-primary-container:    #4F378B;
  --md-on-primary-container: #EADDFF;
  --md-error:              #F2B8B5;
  --md-error-container:    #601410;
  --md-success:            #6DD58C;
  --md-success-container:  #0A3818;
  --md-warning:            #FBC02D;
  --md-warning-container:  #4A3800;
  --md-info:               #90CAF9;
  --md-info-container:     #0D47A1;
  --c-tool:   #90CAF9;
  --c-prompt: #D0BCFF;
  --c-notif:  #FDD835;
  --c-agent:  #81C784;
  --c-lc:     #CAC4D0;
  --shadow-1: 0 1px 2px rgba(0,0,0,.3),  0 1px 3px rgba(0,0,0,.25);
  --shadow-2: 0 2px 6px rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.20);
  --shadow-3: 0 8px 24px rgba(0,0,0,.40), 0 4px 8px rgba(0,0,0,.30);
}

/* ── JSON syntax colors ──────────────────────────────────────────────────── */
.jk { color: #1565C0; }
.js { color: #2E7D32; }
.jn { color: #B3261E; }
.jb { color: #B45309; }
.jx { color: #6750A4; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .jk { color: #7dd3fc; }
  :root:not([data-theme="light"]) .js { color: #86efac; }
  :root:not([data-theme="light"]) .jn { color: #fca5a5; }
  :root:not([data-theme="light"]) .jb { color: #fdba74; }
  :root:not([data-theme="light"]) .jx { color: #c4b5fd; }
}
:root[data-theme="dark"] .jk { color: #7dd3fc; }
:root[data-theme="dark"] .js { color: #86efac; }
:root[data-theme="dark"] .jn { color: #fca5a5; }
:root[data-theme="dark"] .jb { color: #fdba74; }
:root[data-theme="dark"] .jx { color: #c4b5fd; }

/* ── Base ─────────────────────────────────────────────────────────────────── */
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: var(--md-bg);
  color: var(--md-on-surface);
  display: flex;
  height: 100vh;
  overflow: hidden;
  line-height: 1.5;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid var(--md-outline-variant);
  display: flex;
  flex-direction: column;
  background: var(--md-surface);
  overflow: hidden;
}
#sidebar-hdr {
  padding: 16px;
  border-bottom: 1px solid var(--md-outline-variant);
  display: flex;
  align-items: center;
  gap: 8px;
}
#sidebar-hdr .logo {
  font-weight: 600;
  font-size: 14px;
  color: var(--md-on-surface);
  flex: 1;
}
.ws-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--md-outline);
  transition: background .3s;
  flex-shrink: 0;
}
.ws-dot.live { background: var(--md-success); }

#sessions-list { flex: 1; overflow-y: auto; padding: 8px; }

.session-item {
  padding: 10px 12px;
  border-radius: var(--nr-sm);
  cursor: pointer;
  transition: background .12s;
  margin-bottom: 2px;
}
.session-item:hover    { background: var(--md-surface-variant); }
.session-item.active   { background: var(--md-primary-container); }
.session-item .s-proj  { font-weight: 500; font-size: 12px; color: var(--md-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item .s-meta  { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.session-item .s-count { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--md-outline-variant); color: var(--md-on-surface-variant); }
.session-item.active .s-proj  { color: var(--md-on-primary-container); }
.session-item.active .s-meta  { color: var(--md-on-primary-container); opacity: .7; }
.session-item.active .s-count { background: var(--md-primary); color: #fff; }

/* ── Source badges ────────────────────────────────────────────────────────── */
.src-badge { font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 6px; letter-spacing: .3px; text-transform: uppercase; flex-shrink: 0; }
.src-badge.src-claude-code    { background: #EDE9FE; color: #4C1D95; }
.src-badge.src-foundry        { background: #DBEAFE; color: #1E40AF; }
.src-badge.src-copilot-studio { background: #CCFBF1; color: #065F46; }
.src-badge.src-unknown        { background: var(--md-outline-variant); color: var(--md-on-surface-variant); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .src-badge.src-claude-code    { background: #3B0764; color: #DDD6FE; }
  :root:not([data-theme="light"]) .src-badge.src-foundry        { background: #1E3A5F; color: #BFDBFE; }
  :root:not([data-theme="light"]) .src-badge.src-copilot-studio { background: #064E3B; color: #A7F3D0; }
}
:root[data-theme="dark"] .src-badge.src-claude-code    { background: #3B0764; color: #DDD6FE; }
:root[data-theme="dark"] .src-badge.src-foundry        { background: #1E3A5F; color: #BFDBFE; }
:root[data-theme="dark"] .src-badge.src-copilot-studio { background: #064E3B; color: #A7F3D0; }

/* ── Source filter ────────────────────────────────────────────────────────── */
#source-filter { font-size: 11px; padding: 3px 6px; border-radius: var(--nr-sm); border: 1px solid var(--md-outline-variant); background: var(--md-surface-variant); color: var(--md-on-surface); cursor: pointer; }
#filter-row { padding: 6px 8px 0; display: flex; align-items: center; gap: 6px; }
#filter-row label { font-size: 11px; color: var(--md-on-surface-variant); }

/* ── Main ─────────────────────────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

#toolbar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--md-outline-variant);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--md-surface);
  flex-shrink: 0;
}
#toolbar .tb-title {
  font-weight: 600;
  font-size: 13px;
  flex: 1;
  color: var(--md-on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#event-count { font-size: 11px; color: var(--md-on-surface-variant); }

#follow-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--md-on-surface-variant);
  -webkit-user-select: none;
  user-select: none;
  padding: 4px 8px;
  border-radius: var(--nr-sm);
  transition: background .12s;
  cursor: pointer;
}
#follow-toggle:hover { background: var(--md-surface-variant); }

#timeline-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
}
#timeline-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 860px;
}

/* ── Timeline Nodes ──────────────────────────────────────────────────────── */
.tl-node {
  display: flex;
  border-radius: var(--nr);
  cursor: pointer;
  overflow: hidden;
  background: var(--md-surface);
  border: 1px solid var(--md-outline-variant);
  box-shadow: var(--shadow-1);
  transition: box-shadow .15s ease, border-color .15s ease;
  position: relative;
}
.tl-node:hover  { box-shadow: var(--shadow-2); }
.tl-node.active { border-color: var(--md-primary); box-shadow: var(--shadow-2); }

/* Ripple on click */
.tl-node::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, var(--md-primary) 0%, transparent 70%);
  opacity: 0;
  border-radius: inherit;
  pointer-events: none;
  transition: opacity .5s ease;
}
.tl-node:active::after { opacity: .06; transition: none; }

.tl-stripe {
  width: 4px;
  flex-shrink: 0;
  background: var(--c-tool);
}
.tl-tool         .tl-stripe { background: var(--c-tool); }
.tl-prompt       .tl-stripe { background: var(--c-prompt); }
.tl-notification .tl-stripe { background: var(--c-notif); }
.tl-llm          .tl-stripe { background: var(--c-prompt); }

.tl-content {
  flex: 1;
  padding: 10px 12px;
  min-width: 0;
}

.tl-header {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.tl-name {
  font-weight: 500;
  font-size: 13px;
  font-family: 'Roboto Mono', 'SF Mono', Consolas, monospace;
  color: var(--md-on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.tl-label {
  font-weight: 500;
  font-size: 11px;
  color: var(--md-on-surface-variant);
  text-transform: uppercase;
  letter-spacing: .05em;
  white-space: nowrap;
}
.tl-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Status dot */
.sdot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.sdot.success { background: var(--md-success); }
.sdot.error   { background: var(--md-error); }
.sdot.pending { background: var(--md-warning); animation: dpulse 1.4s ease-in-out infinite; }
.sdot.blocked { background: var(--md-on-surface-variant); }

/* Duration pill */
.dur {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--md-surface-variant);
  color: var(--md-on-surface-variant);
  font-weight: 500;
  white-space: nowrap;
}

/* Badges */
.cost-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: var(--md-success-container);
  color: var(--md-success);
  font-weight: 600;
  white-space: nowrap;
}
.model-chip {
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  font-weight: 500;
  font-family: 'Roboto Mono', 'SF Mono', Consolas, monospace;
  white-space: nowrap;
}
.error-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: var(--md-error-container);
  color: var(--md-error);
  font-weight: 600;
  white-space: nowrap;
}
.status-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  font-weight: 500; white-space: nowrap;
}
.status-badge.ended   { background: var(--md-surface-variant); color: var(--md-on-surface-variant); }
.status-badge.running { background: var(--md-info-container);  color: var(--md-info); }

/* Preview text */
.tl-preview {
  font-size: 11px;
  color: var(--md-on-surface-variant);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tl-ptext {
  font-size: 12px;
  color: var(--md-on-surface-variant);
  margin-top: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Expand button */
.exp-btn {
  font-size: 10px;
  color: var(--md-on-surface-variant);
  padding: 2px 4px;
  border-radius: 4px;
  transition: color .12s, background .12s, transform .2s cubic-bezier(.4,0,.2,1);
  flex-shrink: 0;
}
.exp-btn:hover { background: var(--md-surface-variant); color: var(--md-on-surface); }
.exp-btn.open  { transform: rotate(90deg); }

/* Tool detail expand panel — CSS max-height transition */
.tl-details {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height .25s ease-out, opacity .2s ease, margin-top .2s ease;
}
.tl-details.open {
  max-height: 1600px;
  opacity: 1;
  margin-top: 10px;
  transition: max-height .35s ease-in, opacity .25s ease, margin-top .2s ease;
}

/* JSON viewer */
.jv {
  background: var(--md-surface-variant);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--nr-sm);
  padding: 10px 12px;
  font-size: 11px;
  font-family: 'Roboto Mono', 'SF Mono', Consolas, monospace;
  overflow-x: auto;
  white-space: pre;
  line-height: 1.6;
  max-height: 320px;
  overflow-y: auto;
}
.jk { color: #0369a1; }
.js { color: #166534; }
.jn { color: #991b1b; }
.jb { color: #92400e; }
.jx { color: #6d28d9; }

/* Section label above JSON */
.slabel {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--md-on-surface-variant);
  margin-bottom: 4px;
}

/* ── Lifecycle — HR + label ───────────────────────────────────────────────── */
.tl-lc-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 2px;
  color: var(--md-on-surface-variant);
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.tl-lc-rule::before, .tl-lc-rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--md-outline-variant);
}
.tl-lc-label { white-space: nowrap; padding: 0 2px; }

/* ── Agent section ───────────────────────────────────────────────────────── */
.tl-agent {
  border: 1px solid var(--md-outline-variant);
  border-left: 3px solid var(--c-agent);
  border-radius: var(--nr);
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.agent-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: #f0fdf4;
  border-bottom: 1px solid var(--md-outline-variant);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: background .12s;
}
.agent-hdr:hover { background: #dcfce7; }
.agent-lbl {
  font-weight: 600;
  font-size: 12px;
  color: var(--md-on-surface);
  font-family: 'Roboto Mono', 'SF Mono', Consolas, monospace;
}
.agent-type {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--md-success-container);
  color: var(--md-success);
  font-weight: 500;
}
.agent-chevron {
  margin-left: auto;
  font-size: 11px;
  color: var(--md-on-surface-variant);
  flex-shrink: 0;
  transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.tl-agent.collapsed .agent-chevron { transform: rotate(-90deg); }

.agent-body {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 9000px;
  overflow: hidden;
  opacity: 1;
  transition: max-height .3s ease, opacity .25s ease, padding .25s ease;
}
.tl-agent.collapsed .agent-body {
  max-height: 0;
  opacity: 0;
  padding-top: 0;
  padding-bottom: 0;
}

/* ── LLM response node ───────────────────────────────────────────────────── */
.tl-llm { background: #faf5ff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tl-llm { background: #1a1330; }
}
:root[data-theme="dark"] .tl-llm { background: #1a1330; }

/* ── Agent section light bg ──────────────────────────────────────────────── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .agent-hdr         { background: #052e16; }
  :root:not([data-theme="light"]) .agent-hdr:hover   { background: #14532d; }
}
:root[data-theme="dark"] .agent-hdr         { background: #052e16; }
:root[data-theme="dark"] .agent-hdr:hover   { background: #14532d; }

/* ── Theme toggle button ─────────────────────────────────────────────────── */
#theme-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 15px;
  color: var(--md-on-surface-variant);
  flex-shrink: 0;
  transition: background .12s, transform .2s cubic-bezier(.4,0,.2,1);
}
#theme-btn:hover { background: var(--md-surface-variant); transform: rotate(20deg); }

/* ── Thinking node ───────────────────────────────────────────────────────── */
.tl-thinking .tl-stripe { background: #7C3AED; }
.thinking-body {
  font-size: 11px;
  line-height: 1.7;
  color: var(--md-on-surface-variant);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 380px;
  overflow-y: auto;
}

/* ── Assistant text node ─────────────────────────────────────────────────── */
.tl-assistant .tl-stripe { background: #0891B2; }
.assistant-body {
  font-size: 12px;
  line-height: 1.6;
  color: var(--md-on-surface);
  white-space: pre-wrap;
  word-break: break-word;
  margin-top: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.tl-assistant.active .assistant-body,
.tl-assistant .assistant-body.expanded {
  -webkit-line-clamp: unset;
  display: block;
}

/* ── Animations ──────────────────────────────────────────────────────────── */
@keyframes dpulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .35; }
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes wsFlash {
  0%   { box-shadow: 0 0 0 3px rgba(103,80,164,.4), var(--shadow-2); }
  70%  { box-shadow: 0 0 0 3px rgba(103,80,164,.1), var(--shadow-1); }
  100% { box-shadow: var(--shadow-1); }
}
.new-event { animation: fadeSlideIn .35s ease-out, wsFlash 1.6s ease-out; }

/* ── Detail panel ────────────────────────────────────────────────────────── */
#detail-panel {
  position: fixed; right: 0; top: 0; bottom: 0;
  width: var(--detail-w);
  background: var(--md-surface);
  border-left: 1px solid var(--md-outline-variant);
  box-shadow: var(--shadow-3);
  display: flex;
  flex-direction: column;
  z-index: 20;
  transform: translateX(calc(var(--detail-w) + 32px));
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
#detail-panel.open { transform: translateX(0); }

.dp-hdr {
  padding: 14px 16px;
  border-bottom: 1px solid var(--md-outline-variant);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  background: var(--md-surface-container);
}
.dp-hdr-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.dp-icon  { font-size: 18px; flex-shrink: 0; }
.dp-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-sub   { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-close {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  color: var(--md-on-surface-variant);
  font-size: 14px;
  flex-shrink: 0;
  transition: background .12s;
}
.dp-close:hover { background: var(--md-surface-variant); }

#dp-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.mgrid { display: flex; flex-direction: column; }
.mrow  {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--md-outline-variant);
  font-size: 12px;
}
.mrow:last-child { border-bottom: none; }
.mkey { color: var(--md-on-surface-variant); flex-shrink: 0; width: 72px; }
.mval { color: var(--md-on-surface); word-break: break-all; }
.mval.mono { font-family: 'Roboto Mono', 'SF Mono', Consolas, monospace; font-size: 11px; }

.prompt-block {
  background: var(--md-surface-variant);
  border-radius: var(--nr-sm);
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 400px;
  overflow-y: auto;
}

details.raw { border-top: 1px solid var(--md-outline-variant); padding-top: 10px; }
details.raw > summary {
  font-size: 11px;
  font-weight: 500;
  color: var(--md-on-surface-variant);
  cursor: pointer;
  padding: 4px 2px;
  -webkit-user-select: none;
  user-select: none;
  list-style: none;
}
details.raw > summary::before { content: '▶ '; font-size: 9px; }
details.raw[open] > summary::before { content: '▼ '; }

/* ── State screens ───────────────────────────────────────────────────────── */
.screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  color: var(--md-on-surface-variant);
  padding: 32px;
  text-align: center;
}
.screen .screen-icon { font-size: 40px; opacity: .5; }
.screen h2 { font-size: 16px; font-weight: 600; color: var(--md-on-surface); }
.screen p  { font-size: 12px; line-height: 1.7; max-width: 480px; }
.screen pre {
  text-align: left;
  background: var(--md-surface-variant);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--nr);
  padding: 14px 16px;
  font-size: 11px;
  overflow-x: auto;
  max-width: 100%;
  width: 100%;
}
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────────── -->
<div id="sidebar">
  <div id="sidebar-hdr">
    <span class="logo">Agent Monitor</span>
    <button type="button" id="theme-btn" title="Toggle theme">☀</button>
    <span class="ws-dot" id="ws-dot"></span>
  </div>
  <div id="filter-row">
    <label for="source-filter">Source</label>
    <select id="source-filter">
      <option value="">All</option>
      <option value="claude-code">Claude Code</option>
      <option value="foundry">Foundry</option>
      <option value="copilot-studio">Copilot Studio</option>
    </select>
  </div>
  <div id="sessions-list"></div>
</div>

<!-- ── Main ───────────────────────────────────────────────────────────────── -->
<div id="main">
  <div id="toolbar">
    <span class="tb-title" id="tb-title">—</span>
    <span id="event-count"></span>
    <label id="follow-toggle">
      <input type="checkbox" id="follow-cb" checked style="accent-color:var(--md-primary)"> Follow
    </label>
  </div>
  <div id="timeline-wrap">
    <div id="timeline-body"></div>
  </div>
</div>

<!-- ── Detail panel ───────────────────────────────────────────────────────── -->
<div id="detail-panel">
  <div class="dp-hdr">
    <div class="dp-hdr-left">
      <span class="dp-icon" id="dp-icon"></span>
      <div>
        <div class="dp-title" id="dp-title"></div>
        <div class="dp-sub"   id="dp-sub"></div>
      </div>
    </div>
    <button type="button" class="dp-close" id="dp-close">✕</button>
  </div>
  <div id="dp-body"></div>
</div>

<script>
(function () {
  /* ── Theme ─────────────────────────────────────────────────────────────── */
  const html = document.documentElement;
  const themeBtn = document.getElementById('theme-btn');

  function resolveSystemTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
    themeBtn.title = theme === 'dark' ? 'Switch to light' : 'Switch to dark';
  }
  function initTheme() {
    const saved = localStorage.getItem('am-theme');
    applyTheme(saved || resolveSystemTheme());
  }
  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('am-theme', next);
    applyTheme(next);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!localStorage.getItem('am-theme')) applyTheme(resolveSystemTheme());
  });
  initTheme();

  /* ── State ─────────────────────────────────────────────────────────────── */
  let sessionEvents   = [];
  let sessionData     = null;
  let sessions        = {};
  let activeSessionId = null;
  let sessionLoaded   = false;
  let expandedNodes   = new Set();
  let collapsedAgents = new Set();
  let activeNodeId    = null;
  let follow          = true;

  /* ── Helpers ────────────────────────────────────────────────────────────── */
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function shortId(id) { return id ? String(id).slice(0,8) : '\u2014'; }
  function trunc(s, n) { s = String(s ?? ''); return s.length > n ? s.slice(0,n) + '\u2026' : s; }

  function fmtTime(iso) {
    if (!iso) return '\u2014';
    try {
      const d = new Date(iso);
      return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0');
    } catch { return iso; }
  }
  function fmtDur(ms) {
    if (ms == null) return '';
    return ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(1) + 's';
  }
  function fmtSessionDur(start, end) {
    if (!start) return '';
    const ms = (end ? new Date(end) : new Date()) - new Date(start);
    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
    return Math.floor(ms / 60000) + 'm ' + Math.floor((ms % 60000) / 1000) + 's';
  }
  function basename(p) {
    if (!p) return '';
    return p.replace(/\\/g,'/').split('/').pop() || p;
  }

  /* Normalize: bridge WS camelCase and REST snake_case */
  function norm(e) {
    let payload;
    try {
      payload = !e.payload ? {} : typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
    } catch { payload = {}; }
    return {
      id:                      e.id,
      session_id:              e.session_id             ?? e.sessionId             ?? null,
      agent_id:                e.agent_id               ?? e.agentId               ?? 'main',
      parent_agent_id:         e.parent_agent_id        ?? e.parentAgentId         ?? null,
      agent_type:              e.agent_type             ?? e.agentType             ?? null,
      event_type:              e.event_type             ?? e.eventType             ?? '',
      raw_event_name:          e.raw_event_name         ?? e.rawEventName          ?? '',
      tool_name:               e.tool_name              ?? e.toolName              ?? null,
      tool_use_id:             e.tool_use_id            ?? e.toolUseId             ?? null,
      status:                  e.status                 ?? null,
      duration_ms:             e.duration_ms            ?? e.durationMs            ?? null,
      input_tokens:            e.input_tokens           ?? e.inputTokens           ?? null,
      output_tokens:           e.output_tokens          ?? e.outputTokens          ?? null,
      cache_read_input_tokens: e.cache_read_input_tokens ?? e.cacheReadInputTokens ?? null,
      error_text:              e.error_text             ?? e.errorText             ?? null,
      model:                   e.model                  ?? null,
      payload,
      created_at:              e.created_at             ?? e.occurredAt            ?? null,
    };
  }

  /* Syntax-highlight a JSON string */
  function highlight(json) {
    return json.replace(
      /("(?:\\.|[^"\\])*"(?:\s*:)?|true|false|null|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      t => {
        let c = 'jn';
        if (t.startsWith('"')) c = t.trimEnd().endsWith(':') ? 'jk' : 'js';
        else if (t === 'true' || t === 'false') c = 'jb';
        else if (t === 'null') c = 'jx';
        return '<span class="' + c + '">' + t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>';
      }
    );
  }

  /* Extract single-line preview from tool input object */
  function toolPreview(inp) {
    if (!inp || typeof inp !== 'object') return null;
    const keys = ['file_path','path','command','query','url','pattern','content'];
    for (const k of keys) {
      if (inp[k] !== undefined) return trunc(k + ': ' + inp[k], 80);
    }
    const first = Object.keys(inp)[0];
    if (!first) return null;
    return trunc(first + ': ' + inp[first], 80);
  }

  /* Strip claude- prefix and date suffix from model id */
  function shortModel(m) {
    if (!m) return '';
    return m.replace(/^claude-/i,'').replace(/-\d{8}$/,'');
  }

  /* USD cost estimate */
  const MODEL_PRICES = {
    'claude-opus-4':     { input: 15,  output: 75,  cacheRead: 1.5  },
    'claude-opus-4-5':   { input: 15,  output: 75,  cacheRead: 1.5  },
    'claude-sonnet-4':   { input: 3,   output: 15,  cacheRead: 0.3  },
    'claude-sonnet-4-5': { input: 3,   output: 15,  cacheRead: 0.3  },
    'claude-sonnet-4-6': { input: 3,   output: 15,  cacheRead: 0.3  },
    'claude-haiku-3-5':  { input: 0.8, output: 4,   cacheRead: 0.08 },
    'claude-haiku-4-5':  { input: 0.8, output: 4,   cacheRead: 0.08 },
  };
  function estimateCost(model, inp, out, cacheRead) {
    if (!model || (inp == null && out == null)) return null;
    const key = (model || '').replace(/-\d{8}$/,'');
    const p = MODEL_PRICES[key] || MODEL_PRICES[key.split('-').slice(0,3).join('-')];
    if (!p) return null;
    const usd = ((inp||0)*p.input + (out||0)*p.output + (cacheRead||0)*p.cacheRead) / 1e6;
    if (usd === 0) return null;
    return usd < 0.0001 ? '<$0.0001' : '$' + usd.toFixed(4);
  }

  function formatTokens(e) {
    if (e.input_tokens == null && e.output_tokens == null) return null;
    let s = 'in: ' + (e.input_tokens||0).toLocaleString() + '  out: ' + (e.output_tokens||0).toLocaleString();
    if (e.cache_read_input_tokens) s += '  cache: ' + e.cache_read_input_tokens.toLocaleString();
    return s;
  }

  /* ── Group events into timeline tree ────────────────────────────────────── */
  function groupEvents(events) {
    const sorted = events.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

    const resultMap = {};
    for (const e of sorted) {
      if (e.event_type === 'tool_result') {
        const uid = e.tool_use_id ?? e.payload.tool_use_id;
        if (uid && typeof uid === 'string') resultMap[uid] = e;
      }
    }

    const processed = new Set();
    const scopeMap  = {};
    const roots     = [];

    function mk(type, e, extra) {
      return { type, nodeId: 'n-' + e.id, event: e, pairedEvent: null, children: [], stopEvent: null, ...extra };
    }
    function place(node, agentId) {
      if (agentId && agentId !== 'main' && scopeMap[agentId]) scopeMap[agentId].children.push(node);
      else roots.push(node);
    }

    for (const e of sorted) {
      if (e.event_type === 'terminal_chunk') continue;
      if (processed.has(e.id)) continue;
      const ren = e.raw_event_name;

      if (ren === 'SubagentStart') {
        const node = { type: 'agent_section', nodeId: 'agent-' + e.agent_id,
          event: e, pairedEvent: null, children: [], stopEvent: null };
        scopeMap[e.agent_id] = node;
        const parentId = e.parent_agent_id;
        if (parentId && parentId !== 'main' && scopeMap[parentId]) scopeMap[parentId].children.push(node);
        else roots.push(node);

      } else if (ren === 'SubagentStop') {
        const scope = scopeMap[e.agent_id];
        if (scope) scope.stopEvent = e;
        else roots.push(mk('lifecycle', e));

      } else if (e.event_type === 'tool_call') {
        const uid = e.tool_use_id ?? e.payload.tool_use_id;
        const paired = uid ? (resultMap[uid] || null) : null;
        if (paired) processed.add(paired.id);
        place(mk('tool', e, { pairedEvent: paired }), e.agent_id);

      } else if (e.event_type === 'tool_result') {
        // Orphaned result — its PreToolUse wasn't captured or already paired above.
        // Use the result itself as primary so renderTool can still display the output.
        place(mk('tool', e, { pairedEvent: null }), e.agent_id);

      } else if (e.event_type === 'prompt') {
        place(mk('prompt', e), e.agent_id);

      } else if (e.event_type === 'notification') {
        place(mk('notification', e), e.agent_id);

      } else if (e.event_type === 'thinking') {
        place(mk('thinking', e), e.agent_id);

      } else if (e.event_type === 'assistant_text') {
        place(mk('assistant_text', e), e.agent_id);

      } else {
        roots.push(mk('lifecycle', e));
      }
    }
    return roots;
  }

  /* ── Renderers ──────────────────────────────────────────────────────────── */
  function renderNode(node) {
    if (node.type === 'tool')          return renderTool(node);
    if (node.type === 'prompt')        return renderPrompt(node);
    if (node.type === 'notification')  return renderNotif(node);
    if (node.type === 'lifecycle')     return renderLC(node);
    if (node.type === 'agent_section') return renderAgent(node);
    if (node.type === 'thinking')      return renderThinking(node);
    if (node.type === 'assistant_text') return renderAssistantText(node);
    return '';
  }

  function renderTool(node) {
    const primary = node.event || node.pairedEvent;
    if (!primary) return '';
    const paired  = node.pairedEvent;
    const name    = esc(primary.tool_name || '(unknown)');
    const status  = paired?.status ?? primary.status ?? 'pending';
    const dur     = fmtDur(paired?.duration_ms ?? primary.duration_ms ?? null);
    const errText = paired?.error_text ?? primary.error_text ?? null;
    const isOpen  = expandedNodes.has(node.nodeId);
    const isAct   = activeNodeId === node.nodeId;
    const inp     = primary.payload.tool_input;
    const prev    = primary.event_type === 'tool_call' ? toolPreview(inp) : null;
    const inpJson = inp !== undefined ? highlight(JSON.stringify(inp,null,2)) : null;
    const outRaw  = paired?.payload?.tool_result ?? paired?.payload?.output;
    const outJson = outRaw !== undefined ? highlight(trunc(JSON.stringify(outRaw,null,2),4000)) : null;
    const pid     = (paired && paired.id !== primary.id) ? paired.id : '';

    return '<div class="tl-node tl-tool' + (isAct?' active':'') + '" data-node-id="' + node.nodeId + '" data-eid="' + primary.id + '" data-pid="' + pid + '">'
      + '<div class="tl-stripe"></div>'
      + '<div class="tl-content">'
        + '<div class="tl-header">'
          + '<button class="exp-btn' + (isOpen?' open':'') + '" data-exp="' + node.nodeId + '">\u25b6</button>'
          + '<span class="tl-name">' + name + '</span>'
          + '<div class="tl-meta">'
            + '<span class="sdot ' + status + '"></span>'
            + (errText ? '<span class="error-badge">error</span>' : '')
            + (dur ? '<span class="dur">' + dur + '</span>' : '')
          + '</div>'
        + '</div>'
        + (errText
            ? '<div class="tl-preview" style="color:var(--md-error)">' + esc(trunc(errText,120)) + '</div>'
            : (prev ? '<div class="tl-preview">' + esc(prev) + '</div>' : ''))
        + '<div class="tl-details' + (isOpen?' open':'') + '">'
          + (inpJson ? '<div><div class="slabel">Input</div><pre class="jv">' + inpJson + '</pre></div>' : '')
          + (outJson ? '<div><div class="slabel">Output</div><pre class="jv">' + outJson + '</pre></div>' : '')
          + (errText ? '<div><div class="slabel">Error</div><pre class="jv" style="border-color:var(--md-error-container)">' + esc(errText) + '</pre></div>' : '')
        + '</div>'
      + '</div>'
    + '</div>';
  }

  function renderPrompt(node) {
    const e   = node.event;
    const msg = e.payload.prompt ?? e.payload.message ?? e.payload.user_message ?? '';
    const isAct = activeNodeId === node.nodeId;
    return '<div class="tl-node tl-prompt' + (isAct?' active':'') + '" data-node-id="' + node.nodeId + '" data-eid="' + e.id + '">'
      + '<div class="tl-stripe"></div>'
      + '<div class="tl-content">'
        + '<div class="tl-header">'
          + '<span class="tl-label">Prompt</span>'
          + '<span style="font-size:10px;color:var(--muted);margin-left:auto">' + fmtTime(e.created_at) + '</span>'
        + '</div>'
        + '<div class="tl-ptext">' + esc(String(msg).slice(0,200)) + '</div>'
      + '</div>'
    + '</div>';
  }

  function renderNotif(node) {
    const e   = node.event;
    const msg = e.payload.message ?? e.payload.text ?? '';
    const isAct = activeNodeId === node.nodeId;
    return '<div class="tl-node tl-notification' + (isAct?' active':'') + '" data-node-id="' + node.nodeId + '" data-eid="' + e.id + '">'
      + '<div class="tl-stripe"></div>'
      + '<div class="tl-content">'
        + '<div class="tl-header">'
          + '<span class="tl-label" style="color:var(--c-notif)">Notification</span>'
          + '<span style="font-size:10px;color:var(--muted);margin-left:auto">' + fmtTime(e.created_at) + '</span>'
        + '</div>'
        + '<div class="tl-preview">' + esc(trunc(String(msg),200)) + '</div>'
      + '</div>'
    + '</div>';
  }

  function renderLC(node) {
    const e = node.event;
    if (e.input_tokens != null || e.output_tokens != null || e.model) {
      return renderLLMResponse(node);
    }
    return '<div class="tl-lc-rule"><span class="tl-lc-label">' + esc(e.raw_event_name || e.event_type || 'lifecycle') + '</span></div>';
  }

  function renderLLMResponse(node) {
    const e     = node.event;
    const isAct = activeNodeId === node.nodeId;
    const cost  = estimateCost(e.model, e.input_tokens, e.output_tokens, e.cache_read_input_tokens);
    const total = (e.input_tokens||0) + (e.output_tokens||0);
    const label = e.raw_event_name || 'LLM Response';

    return '<div class="tl-node tl-llm' + (isAct?' active':'') + '" data-node-id="' + node.nodeId + '" data-eid="' + e.id + '">'
      + '<div class="tl-stripe"></div>'
      + '<div class="tl-content">'
        + '<div class="tl-header">'
          + '<span class="tl-label">' + esc(label) + '</span>'
          + (e.model ? '<span class="model-chip">' + esc(shortModel(e.model)) + '</span>' : '')
          + '<div class="tl-meta">'
            + (cost ? '<span class="cost-badge">' + esc(cost) + '</span>' : '')
            + (total ? '<span class="dur">' + total.toLocaleString() + ' tok</span>' : '')
            + '<span style="font-size:10px;color:var(--muted)">' + fmtTime(e.created_at) + '</span>'
          + '</div>'
        + '</div>'
        + (e.input_tokens != null
            ? '<div class="tl-preview">in: ' + (e.input_tokens||0).toLocaleString()
              + ' \u00b7 out: ' + (e.output_tokens||0).toLocaleString()
              + (e.cache_read_input_tokens ? ' \u00b7 cache: ' + e.cache_read_input_tokens.toLocaleString() : '')
              + '</div>'
            : '')
      + '</div>'
    + '</div>';
  }

  function renderThinking(node) {
    const e      = node.event;
    const isAct  = activeNodeId === node.nodeId;
    const isOpen = expandedNodes.has(node.nodeId);
    const thinking = e.payload.thinking ?? '';
    const preview  = trunc(thinking.replace(/\n/g,' '), 120);
    // Full text is NOT embedded in the DOM — populated lazily on expand to avoid massive innerHTML
    return '<div class="tl-node tl-thinking' + (isAct?' active':'') + '" data-node-id="' + node.nodeId + '" data-eid="' + e.id + '">'
      + '<div class="tl-stripe"></div>'
      + '<div class="tl-content">'
        + '<div class="tl-header">'
          + '<button class="exp-btn' + (isOpen?' open':'') + '" data-exp="' + node.nodeId + '">▶</button>'
          + '<span class="tl-label">💭 Thinking</span>'
          + '<span style="font-size:10px;color:var(--muted);margin-left:auto">' + fmtTime(e.created_at) + '</span>'
        + '</div>'
        + '<div class="tl-preview">' + esc(preview) + '</div>'
        + '<div class="tl-details' + (isOpen?' open':'') + '"></div>'
      + '</div>'
    + '</div>';
  }

  function renderAssistantText(node) {
    const e     = node.event;
    const isAct = activeNodeId === node.nodeId;
    const text  = e.payload.text ?? '';
    return '<div class="tl-node tl-assistant' + (isAct?' active':'') + '" data-node-id="' + node.nodeId + '" data-eid="' + e.id + '">'
      + '<div class="tl-stripe"></div>'
      + '<div class="tl-content">'
        + '<div class="tl-header">'
          + '<span class="tl-label">Claude</span>'
          + '<span style="font-size:10px;color:var(--muted);margin-left:auto">' + fmtTime(e.created_at) + '</span>'
        + '</div>'
        + '<div class="assistant-body">' + esc(trunc(text, 600)) + '</div>'
      + '</div>'
    + '</div>';
  }

  function renderAgent(node) {
    const e         = node.event;
    const agentType = e.agent_type || e.payload.agent_type || null;
    const isDone    = !!node.stopEvent;
    const isColl    = collapsedAgents.has(e.agent_id);
    const kids      = node.children.map(renderNode).join('');

    return '<div class="tl-agent' + (isColl?' collapsed':'') + '" data-agent-id="' + esc(e.agent_id) + '">'
      + '<div class="agent-hdr">'
        + '<span class="agent-lbl">\u2b21 ' + shortId(e.agent_id) + '</span>'
        + (agentType ? '<span class="agent-type">' + esc(agentType) + '</span>' : '')
        + '<span class="status-badge ' + (isDone?'ended':'running') + '">' + (isDone?'done':'live') + '</span>'
        + '<span class="agent-chevron">\u25bc</span>'
      + '</div>'
      + '<div class="agent-body">'
        + (kids || '<div style="color:var(--muted);font-size:11px;padding:4px">No events yet</div>')
      + '</div>'
    + '</div>';
  }

  /* ── Source badge helpers ───────────────────────────────────────────────── */
  const SOURCE_LABELS = {
    'claude-code':    'Claude',
    'foundry':        'Foundry',
    'copilot-studio': 'Copilot',
  };
  function sourceBadge(src) {
    const label = SOURCE_LABELS[src] || src || 'unknown';
    const cls   = 'src-badge src-' + (src || 'unknown').replace(/[^a-z0-9-]/g, '-');
    return '<span class="' + cls + '">' + esc(label) + '</span>';
  }

  /* ── Sidebar ────────────────────────────────────────────────────────────── */
  function renderSessions() {
    const list   = document.getElementById('sessions-list');
    const filter = document.getElementById('source-filter').value;
    let items  = Object.values(sessions).sort((a,b) => new Date(b.started_at) - new Date(a.started_at));
    if (filter) items = items.filter(s => (s.source || 'claude-code') === filter);
    if (!items.length) {
      list.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--muted)">No sessions yet</div>';
      return;
    }
    list.innerHTML = items.map(s => {
      const proj  = basename(s.project_path) || shortId(s.id);
      const live  = !s.ended_at;
      const dur   = fmtSessionDur(s.started_at, s.ended_at);
      const count = s.event_count || 0;
      const isAct = s.id === activeSessionId;
      return '<div class="session-item' + (isAct?' active':'') + '" data-sid="' + esc(s.id) + '">'
        + '<div class="s-proj">' + esc(proj) + '</div>'
        + '<div class="s-meta">'
          + sourceBadge(s.source || 'claude-code')
          + (live ? '<span style="color:var(--md-success);font-size:10px;font-weight:600">\u25cf live</span>' : '')
          + (dur  ? '<span>' + dur + '</span>' : '')
          + '<span class="s-count">' + count + '</span>'
        + '</div>'
      + '</div>';
    }).join('');
    list.querySelectorAll('.session-item[data-sid]').forEach(el =>
      el.addEventListener('click', () => selectSession(el.dataset.sid))
    );
  }
/* ── Timeline ───────────────────────────────────────────────────────────── */
  function renderAll() {
    const body = document.getElementById('timeline-body');
    const wrap = document.getElementById('timeline-wrap');
    const prevScroll = wrap.scrollTop;

    if (sessionData) {
      const s = sessionData.session;
      const proj = basename(s.project_path) || shortId(s.id);
      const dur  = fmtSessionDur(s.started_at, s.ended_at);
      document.getElementById('tb-title').textContent = proj + (dur ? '  \u00b7  ' + dur : '');
    } else {
      document.getElementById('tb-title').textContent = '\u2014';
    }
    document.getElementById('event-count').textContent =
      sessionEvents.length ? sessionEvents.length + ' events' : '';

    if (!activeSessionId) { body.innerHTML = renderEmptyScreen(); return; }
    if (!sessionLoaded) {
      body.innerHTML = '<div class="screen"><div class="screen-icon">\u23f3</div><p>Loading\u2026</p></div>';
      return;
    }
    if (!sessionEvents.length) {
      body.innerHTML = '<div class="screen"><div class="screen-icon">\ud83d\udd0d</div><p>No events in this session yet.</p></div>';
      return;
    }

    const nodes = groupEvents(sessionEvents);
    body.innerHTML = nodes.map(renderNode).join('');
    bindEvents();

    if (follow) wrap.scrollTop = wrap.scrollHeight;
    else wrap.scrollTop = prevScroll;
  }

  function renderEmptyScreen() {
    const cfg = JSON.stringify({ hooks: {
      PreToolUse:       [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      PostToolUse:      [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      UserPromptSubmit: [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      SubagentStart:    [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      SubagentStop:     [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      Stop:             [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      Notification:     [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      SessionStart:     [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
      SessionEnd:       [{ hooks: [{ type:'http', url:'http://127.0.0.1:4317/ingest/claude-code', timeout:2 }] }],
    }}, null, 2);
    return '<div class="screen"><div class="screen-icon">\ud83d\udd0c</div>'
      + '<h2>No sessions yet</h2>'
      + '<p>Add these hooks to <code>~/.claude/settings.json</code>, then start a Claude Code session:</p>'
      + '<pre>' + esc(cfg) + '</pre></div>';
  }

  /* ── Detail panel ───────────────────────────────────────────────────────── */
  function buildDetail(event, paired) {
    const e  = event;
    const et = e.event_type;
    const icons = { tool_call:'\u2699', tool_result:'\u2713', prompt:'\ud83d\udcac', lifecycle:'\u00b7', notification:'\u2139', thinking:'\ud83d\udcad', assistant_text:'\ud83d\udcac' };
    document.getElementById('dp-icon').textContent  = icons[et] || '\u00b7';
    document.getElementById('dp-title').textContent = e.raw_event_name || et || 'Event';
    document.getElementById('dp-sub').textContent   = e.tool_name || '';

    const cost  = estimateCost(e.model, e.input_tokens, e.output_tokens, e.cache_read_input_tokens);
    const rows = [
      ['Session',  shortId(e.session_id), true],
      ['Agent',    shortId(e.agent_id),   true],
      ['Time',     fmtTime(e.created_at), false],
      ['Status',   e.status,              false],
      ['Duration', fmtDur(e.duration_ms), false],
      ['Model',    e.model,               true],
      ['Tokens',   formatTokens(e),       false],
      ['Cost',     cost,                  false],
      ['Error',    e.error_text,          false],
    ].filter(([,v]) => v != null && v !== '');

    const metaHtml = rows.map(([k,v,mono]) =>
      '<div class="mrow"><span class="mkey">' + esc(k) + '</span><span class="mval' + (mono?' mono':'') + '">' + esc(String(v)) + '</span></div>'
    ).join('');

    let html = '<div class="mgrid">' + metaHtml + '</div>';

    if (et === 'tool_call' || et === 'tool_result') {
      const inp = e.payload.tool_input !== undefined ? e.payload.tool_input : paired?.payload?.tool_input;
      const out = paired?.payload?.tool_result !== undefined ? paired.payload.tool_result : e.payload.tool_result;
      if (inp !== undefined) html += '<div><div class="slabel">Input</div><pre class="jv">' + highlight(JSON.stringify(inp,null,2)) + '</pre></div>';
      if (out !== undefined) html += '<div><div class="slabel">Output</div><pre class="jv">' + highlight(trunc(JSON.stringify(out,null,2),4000)) + '</pre></div>';
    }
    if (et === 'prompt') {
      const txt = e.payload.prompt ?? e.payload.message ?? e.payload.user_message ?? '';
      html += '<div><div class="slabel">Prompt</div><div class="prompt-block">' + esc(String(txt)) + '</div></div>';
    }
    if (et === 'thinking') {
      const txt = e.payload.thinking ?? '';
      html += '<div><div class="slabel">Thinking</div><div class="prompt-block thinking-body">' + esc(String(txt)) + '</div></div>';
    }
    if (et === 'assistant_text') {
      const txt = e.payload.text ?? '';
      html += '<div><div class="slabel">Response</div><div class="prompt-block">' + esc(String(txt)) + '</div></div>';
    }
    html += '<details class="raw"><summary>Raw payload</summary><pre class="jv">' + highlight(JSON.stringify(e.payload,null,2)) + '</pre></details>';
    document.getElementById('dp-body').innerHTML = html;
  }

  function openDetail(event, paired) {
    buildDetail(event, paired);
    document.getElementById('detail-panel').classList.add('open');
  }
  function closeDetail() {
    document.getElementById('detail-panel').classList.remove('open');
    activeNodeId = null;
    renderAll();
  }

  /* ── Event binding ──────────────────────────────────────────────────────── */
  function bindEvents() {
    const body = document.getElementById('timeline-body');

    // Expand — in-DOM toggle; thinking nodes get lazily populated on first open
    body.querySelectorAll('[data-exp]').forEach(btn => {
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        const nid     = btn.dataset.exp;
        const nodeEl  = btn.closest('.tl-node');
        const details = btn.closest('.tl-content')?.querySelector('.tl-details');
        if (expandedNodes.has(nid)) {
          expandedNodes.delete(nid);
          btn.classList.remove('open');
          details?.classList.remove('open');
        } else {
          expandedNodes.add(nid);
          btn.classList.add('open');
          details?.classList.add('open');
          // Lazy-load thinking text on first expand (keeps initial DOM small)
          if (details && !details.hasChildNodes() && nodeEl?.classList.contains('tl-thinking')) {
            const eid = parseInt(nodeEl.dataset.eid);
            const ev2 = sessionEvents.find(e => e.id === eid);
            if (ev2) {
              const d = document.createElement('div');
              d.className = 'thinking-body';
              d.textContent = ev2.payload.thinking ?? '';
              details.appendChild(d);
            }
          }
        }
      });
    });

    // Agent collapse — in-DOM toggle, no re-render
    body.querySelectorAll('.agent-hdr').forEach(hdr => {
      hdr.addEventListener('click', () => {
        const section = hdr.closest('.tl-agent');
        const agentId = section?.dataset?.agentId;
        if (!agentId) return;
        if (collapsedAgents.has(agentId)) collapsedAgents.delete(agentId);
        else collapsedAgents.add(agentId);
        section.classList.toggle('collapsed', collapsedAgents.has(agentId));
      });
    });

    // Node click → detail panel
    body.querySelectorAll('.tl-node').forEach(el => {
      el.addEventListener('click', () => {
        const nid = el.dataset.nodeId;
        if (!nid) return;
        const eid = el.dataset.eid ? Number(el.dataset.eid) : null;
        const pid = el.dataset.pid ? Number(el.dataset.pid) : null;
        if (!eid) return;
        const primary = sessionEvents.find(e => e.id === eid);
        if (!primary) return;
        const paired = (pid && pid !== eid) ? sessionEvents.find(e => e.id === pid) : null;
        activeNodeId = nid;
        openDetail(primary, paired);
        renderAll();
      });
    });
  }

  /* ── Session loading ────────────────────────────────────────────────────── */
  async function selectSession(sid) {
    if (sid === activeSessionId) return;
    activeSessionId = sid;
    sessionEvents   = [];
    sessionData     = null;
    sessionLoaded   = false;
    activeNodeId    = null;
    document.getElementById('detail-panel').classList.remove('open');
    renderSessions();
    renderAll();
    try {
      const resp = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/tree');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const tree = await resp.json();
      sessionData   = { session: tree.session, agents: tree.agents };
      sessionEvents = (tree.events || []).map(norm);
    } catch (err) {
      console.error('[selectSession]', err);
    } finally {
      sessionLoaded = true;
      renderAll();
    }
  }

  /* ── WebSocket ──────────────────────────────────────────────────────────── */
  function connectWS() {
    const ws  = new WebSocket('ws://127.0.0.1:4317/live');
    const dot = document.getElementById('ws-dot');
    ws.addEventListener('open',  () => dot.classList.add('live'));
    ws.addEventListener('close', () => { dot.classList.remove('live'); setTimeout(connectWS, 3000); });
    ws.addEventListener('error', () => ws.close());
    ws.addEventListener('message', ev => {
      let raw;
      try { raw = JSON.parse(ev.data); } catch { return; }
      const e   = norm(raw);
      const sid = e.session_id;
      if (!sid) return;
      if (!sessions[sid]) {
        sessions[sid] = { id: sid, source: 'claude-code', started_at: e.created_at,
          project_path: e.payload.cwd || null, event_count: 0 };
      }
      sessions[sid].event_count = (sessions[sid].event_count || 0) + 1;
      if (e.raw_event_name === 'SessionEnd' || e.raw_event_name === 'Stop') sessions[sid].ended_at = e.created_at;
      if (!sessions[sid].project_path && e.payload.cwd) sessions[sid].project_path = e.payload.cwd;
      renderSessions();

      if (sid === activeSessionId && sessionLoaded) {
        const incomingId = e.id;
        sessionEvents.push(e);
        renderAll();
        if (incomingId) {
          const newNode = document.querySelector('[data-eid="' + incomingId + '"]');
          if (newNode) {
            newNode.classList.add('new-event');
            newNode.addEventListener('animationend', () => newNode.classList.remove('new-event'), { once: true });
          }
        }
      }
    });
  }

  /* ── Init ───────────────────────────────────────────────────────────────── */
  async function init() {
    document.getElementById('follow-cb').addEventListener('change', ev => { follow = ev.target.checked; });
    document.getElementById('source-filter').addEventListener('change', renderSessions);
    document.getElementById('dp-close').addEventListener('click', closeDetail);
    renderAll();
    connectWS();
    try {
      const resp = await fetch('/api/sessions');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const list = await resp.json();
      for (const s of list) sessions[s.id] = s;
      renderSessions();
      if (list.length > 0) selectSession(list[0].id);
    } catch (err) {
      console.error('[init]', err);
    }
  }

  init();
})();
</script>
</body>
</html>
