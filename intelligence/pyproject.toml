[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentgov-intel"
version = "0.1.0"
description = "Python intelligence service for Agent Governance Monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-framework>=1.19,<2",
  "agent-framework-openai>=1.14,<2",
  "agent-framework-foundry>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "azure-identity>=1.17,<2",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "typesafe-sdk>=0.7.2,<0.8",
]

[project.optional-dependencies]
observability = [
  "azure-monitor-opentelemetry>=1.6,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgov_intel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
